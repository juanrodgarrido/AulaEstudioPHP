<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" media="screen" href="style.css" />
    <title>Resultados</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <div class = "resultados">
        <h1>Resumen del formulario</h1>        
        <div class="formResultado">          
            <label for="nombre">Nombre:</label>
            <input
              id="nombre"
              class="nombreResultado"
              name="nombre"
              type="text"              
              readonly
            />
            <label for="apellido1">Primer apellido:</label>
            <input
              id="apellido1"
              class="apellido1Resultado"
              name="apellido1"
              type="text"
              placeholder="Rodriguez"
              readonly
            />
            <label for="apellido2">Segundo apellido:</label>
            <input
              id="apellido2"
              class="apellido2Resultado"
              name="apellido2"
              type="text"
              placeholder="Garrido"
              readonly
            />
            <label for="dni">DNI</label>
            <input
              id="dni"
              class="dniResultado"
              name="dni"
              type="text"
              placeholder="01234567A"
              readonly
              maxlength="9"
            />
            <label for="email">Correo electrónico</label>
            <input
              name="email"
              class="emailResultado"
              id="email"
              type="email"
              placeholder="jrodgar@aulaestudio.es"
              readonly
            />
            <button type="button" class="btnform2" onclick="window.location.href='index.html'">Volver atrás</button>
          
        </div>
    </div>



    <script src="script.js"></script>
  </body>
</html>
